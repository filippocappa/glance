name: Glance
options:
  bundleIdPrefix: com.filippocappa
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Glance:
    type: application
    platform: macOS
    sources:
      - path: Glance
        excludes:
          - "*.xcassets/AppIcon.appiconset/*.png"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filippocappa.glance
        INFOPLIST_FILE: Glance/Info.plist
        CODE_SIGN_ENTITLEMENTS: Glance/Glance.entitlements
        PRODUCT_NAME: Glance
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: true
    postBuildScripts:
      - name: "Consistently Code Sign App Bundle"
        script: |
          echo "Ad-hoc signing app bundle at ${CODESIGNING_FOLDER_PATH}"
          codesign --force --deep --sign - --entitlements "${SRCROOT}/Glance/Glance.entitlements" "${CODESIGNING_FOLDER_PATH}"
