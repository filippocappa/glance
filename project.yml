name: Glance
options:
  bundleIdPrefix: com.filippocappa
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: "1.1.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"

targets:
  Glance:
    type: application
    platform: macOS
    dependencies:
      - package: LaunchAtLogin
        product: LaunchAtLogin
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    sources:
      - path: Glance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filippocappa.glance
        INFOPLIST_FILE: Glance/Info.plist
        CODE_SIGN_ENTITLEMENTS: Glance/Glance.entitlements
        PRODUCT_NAME: Glance
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        # A STABLE signing identity is mandatory here. TCC (Screen Recording)
        # pins its grant to the app's designated requirement. With an ad-hoc
        # signature there is no team identifier, so TCC falls back to the
        # cdhash -- which changes on every single build, silently revoking the
        # Screen Recording permission each time you rebuild.
        CODE_SIGN_STYLE: Manual
        # Identified by SHA-1 rather than by name: Xcode maps the friendly name
        # "Apple Development" to "Mac Development" and then demands a matching
        # provisioning profile, which a local-only agent app does not need.
        CODE_SIGN_IDENTITY: "4C62BBDC1767F52AB92F5E37E08C0877AA752ACF"
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        COMBINE_HIDPI_IMAGES: true
